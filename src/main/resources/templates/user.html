<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Perfil</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div id="books" class="border border-2 border-primary rounded">
            <label for="isbn">ISBN</label><input id="isbn" value="9780140328721" />
            <button id="fetchBook">Buscar datos online</button>
            <img class="preview" id="portada" alt="portada del libro" />
            <form th:action="@{/user/__${user.id}__/pic}">
                <button id="postPortada" class="perfilable">Usar como foto de perfil</button>
            </form>
        </div>
        <div id="movies" class="border border-2 border-secondary rounded">
            <label for="imdb">IMDB</label><input id="imdb" value="tt11286314" />
            <button id="fetchMovie">Buscar datos online</button>
            <img class="preview" id="poster" alt="poster de la pelicula" />
            <form th:action="@{/user/__${user.id}__/pic}">
                <button id="postPoster" class="perfilable">Usar como foto de perfil</button>
            </form>
        </div>
        <div id="profile" class="border border-2 border-tertiary rounded">
            <input type="file" id="f_avatar" accept="image/jpeg,image/png">
            <img class="preview" id="avatar" alt="careto a subir" />
            <form th:action="@{/user/__${user.id}__/pic}">
                <button id="postAvatar">Usar como foto de perfil</button>
            </form>
        </div>

        <div class="container">
            <h1 class="mt-5">Perfil de <span th:text="${user.username}">Paco</span></h1>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card text-center shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="card-title text-muted">+2 jugados</h6>
                            <h3 class="card-text" th:text="${user.drawTwoPlayed}">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="card-title text-muted">+4 jugados</h6>
                            <h3 class="card-text" th:text="${user.drawFourPlayed}">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="card-title text-muted">+2 robados</h6>
                            <h3 class="card-text" th:text="${user.drawTwoDrawn}">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="card-title text-muted">+4 robados</h6>
                            <h3 class="card-text" th:text="${user.drawFourDrawn}">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Veces con 1 carta</h6>
                            <h3 class="card-text" th:text="${user.oneCardMoments}">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-lg-6">
                    <h4 class="mb-3">Buscar jugador</h4>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form id="friend-search-form" class="mb-2">
                                <div class="input-group">
                                    <input id="friend-search-input" class="form-control" type="text" placeholder="Username exacto" required>
                                    <button id="friend-search-submit" class="btn btn-primary" type="submit">Enviar solicitud</button>
                                </div>
                            </form>
                            <div id="friend-feedback" class="small text-muted"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 mt-4 mt-lg-0">
                    <h4 class="mb-3">Solicitudes pendientes</h4>
                    <div class="card shadow-sm mb-3">
                        <ul id="friend-requests" class="list-group list-group-flush"></ul>
                    </div>
                    <h4 class="mb-3">Amigos</h4>
                    <div class="card shadow-sm">
                        <ul id="friend-list" class="list-group list-group-flush"></ul>
                    </div>
                </div>
            </div>

            <!-- recepción de mensajes -->
            <div class="py-5 row" id="mensajes">
            </div>
            <!-- envío de mensajes -->
            <div class="py-5 row ">
                <form th:action="@{/user/__${user.id}__/msg}" method="POST">
                    <input type="text" id="message" placeholder="escribe a este usuario" />
                    <button id="sendmsg" class="btn btn-secondary" type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script th:src="@{/js/ajax-demo.js}"></script>
    <script th:src="@{/js/friend-requests.js}"></script>
</body>

</html>
