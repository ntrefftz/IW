<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Bienvenido</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container mt-5 mb-5">

            <h1 class="mb-4">Tú Perfil</h1>

            <div class="card mb-4 shadow-sm">
                <div class="card-body d-flex align-items-center">
                    <img id="current-avatar" th:src="@{/user/{id}/pic(id=${u.id})}" class="rounded-circle me-4" alt="Avatar"
                        style="width: 100px; height: 100px; object-fit: cover;">
                    <div>
                        <h2 class="card-title mb-1"><span th:text="${u.username}">Usuario</span></h2>
                        </h2>
                    </div>
                    <div id="profile" class=" ms-auto border border-2 border-tertiary rounded">
                        <form id="avatar-form" th:action="@{/user/{id}/pic(id=${u.id})}" method="post" enctype="multipart/form-data">
                            <input type="file" id="f_avatar" name="photo" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                            <img class="preview" id="avatar" alt="careto a subir" />
                            <button id="postAvatar" type="submit">Usar como foto de perfil</button>
                            <div id="avatar-feedback" class="small mt-2"></div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">



                    <h4 class="mb-3">Estadisticas</h4>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="card text-center shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">+2 jugados</h6>
                                    <h3 class="card-text" th:text="${u.drawTwoPlayed}">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">+4 jugados</h6>
                                    <h3 class="card-text" th:text="${u.drawFourPlayed}">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">+2 robados</h6>
                                    <h3 class="card-text" th:text="${u.drawTwoDrawn}">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">+4 robados</h6>
                                    <h3 class="card-text" th:text="${u.drawFourDrawn}">0</h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center shadow-sm h-100">
                                <div class="card-body">
                                    <h6 class="card-title text-muted">Veces con 1 carta</h6>
                                    <h3 class="card-text" th:text="${u.oneCardMoments}">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>

                <div class="col-lg-4 mt-4 mt-lg-0">
                    <h4 class="mb-3">Tus mejores Frenemies</h4>
                    <div class="card shadow-sm">
                        <ul id="friend-list" class="list-group list-group-flush"></ul>
                    </div>
                </div>

            </div>

            <div class="row mt-4">
                <div class="col-lg-6">
                    <h4 class="mb-3">Buscar jugador</h4>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form id="friend-search-form" class="mb-2">
                                <div class="input-group">
                                    <input id="friend-search-input" class="form-control" type="text"
                                        placeholder="Nombre de usuario" required>
                                    <button id="friend-search-submit" class="btn btn-primary" type="submit">Enviar
                                        solicitud</button>
                                </div>
                            </form>
                            <div id="friend-feedback" class="small text-muted"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 mt-4 mt-lg-0">
                    <h4 class="mb-3">Solicitudes pendientes</h4>
                    <div class="card shadow-sm mb-3">
                        <ul id="friend-requests" class="list-group list-group-flush"></ul>
                    </div>


                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
    <script th:src="@{/js/friend-requests.js}"></script>
    <script th:src="@{/js/profile.js}" src="/js/profile.js"></script>
</body>

</html>
