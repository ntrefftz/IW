<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Admin</title>
   
    
    <link rel="stylesheet" th:href="@{/css/simple-datatables-10.css}" href="/css/simple-datatables-10.css" type="text/css" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css" type="text/css" />
    <link rel="stylesheet" th:href="@{/css/bootstrap-5.3.3.css}" href="/css/bootstrap-5.3.3.css" type="text/css" />
</head>

<body>
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="container-fluid d-flex justify-content-center">
        <div class="contenedor-admin m-5 ">
            <h1 class="titulo-admin">Gestión de usuarios</h1>
            <button id="botonAnadir" class="btn btn-primary boton-anadir mb-3">Añadir usuario</button>
            <div id="modalUsuario" class="modal-usuario" style="display:none;">
            <div class="modal-contenido">
                <div class="container d-flex mt-4">
                    <span id="cerrarModal" class="modal-cerrar text-danger fw-bold px-3" style="font-size: 2rem; cursor:pointer;">&times;</span>
                    <h4 class="mb-3">Nuevo usuario</h4>
                </div>
                <form id="formUsuario" class="container">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <label for="nombreUsuario" class="form-label">Nombre y apellidos</label>
                            <input type="text" id="nombreUsuario" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="rolUsuario" class="form-label">Rol</label>
                            <input type="text" id="rolUsuario" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="grupoUsuario" class="form-label">Grupo</label>
                            <input type="text" id="grupoUsuario" class="form-control">
                        </div>
                        <div class="col-md-2 ">
                            <button type="submit" class="btn btn-primary w-100">Añadir</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <h3 class="mt-5">Usuarios</h3>
        <table id="tablaUsuarios" class="tabla-usuarios table table-striped table-hover align-middle table-bordered">
            <thead>
            <tr>
                <th>Id</th>
                <th>Nombre & Apellidos</th>
                <th>Roles</th>
                <th>Grupos</th>
                <th class="acciones">Acciones</th>
                <th >Opciones</th>

            </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">paco</td>
                    <td th:text="${user.firstName + ' ' + user.lastName}">Nombre</td>
                    <td>
                        <ul>
                            <li th:text="${user.roles}">Role</li>
                        </ul>
                    </td>
                    <td>
                        <ul>
                            <li th:text="${user.groups}">Role</li>
                        </ul>
                    </td>
                    <td>
                        <form th:action="@{'/admin/toggle/' + ${user.id}}" th:method="post">
                            <button th:if="${user.enabled}" type="submit"
                                class="toggle btn btn-danger">Deshabilitar</button>
                            <button th:unless="${user.enabled}" type="submit"
                                class="toggle btn btn-primary">Habilitar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
         <br>
         <hr>
        <div class="container m-2">

            <h2>Últimos 5 mensajes del sistema</h2>
            <table id="messages"></table> <!-- will be filled with JSON data-->
            <button id="refresh" class="btn btn-primary">Actualizar vía AJAX</button>

        </div>
        
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
    <script>
        const toggles = document.querySelectorAll('.toggle');
        toggles.forEach(toggle => {
            toggle.addEventListener('click', (e) => {
                e.preventDefault();
                const form = e.target.parentElement;
                go(form.action, 'POST').then((d) => {
                    if (d.enabled) {
                        e.target.classList.remove('btn-primary');
                        e.target.classList.add('btn-danger');
                        e.target.textContent = 'Deshabilitar';
                    } else {
                        e.target.classList.remove('btn-danger');
                        e.target.classList.add('btn-primary');
                        e.target.textContent = 'Habilitar';
                    }
                    console.log(d);
                });
            });
        });


    </script>

    <script type="module">
        import { DataTable } from "../js/simple-datatables-10.js"
        let dt = null;
        function refreshMessages() {
            go('/admin/all-messages', 'GET').then((d) => {
                if (dt) {
                    dt.destroy();
                    document.querySelector("#messages").innerHTML = '';
                }
                dt = new DataTable('#messages', {
                    data: {
                        headings: ['from', 'to', 'text'],
                        data: d
                    },
                    searchable: true,
                    paging: false
                });
                dt.on("datatable.selectrow", (rowIndex, event, focused) => {
                    event.preventDefault();
                    console.log("click en fila: ", dataTable.data[rowIndex]);
                });
            });
        }
        document.getElementById('refresh').addEventListener('click', refreshMessages);
        refreshMessages();
    </script>

    <script th:src="@{/js/admin.js}"></script>
</body>

</html>
