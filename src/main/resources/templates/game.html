<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Welcome</title>
</head>

<body class="d-flex flex-column h-100 bg-light">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0" style="height: calc(100vh - 160px); overflow-y: auto;">
    <div class="container-fluid h-100 py-3">
        <div class="container">
        <div class="row g-4 px-4 h-100">
            
            <div class="col-md-6 d-flex flex-column" style="min-height: 0;">
                <h3 class="h5">Imagen:</h3>
                <div class="card flex-grow-1 border-0 shadow-sm overflow-hidden">
                    <div class="card-body p-0 d-flex align-items-center justify-content-center bg-dark">
                        <img th:src="@{/img/UNO-placeholder-pic.png}" class="img-fluid" alt="Referencia" style="max-height: 100%;">
                    </div>
                </div>
            </div>

            <div class="col-md-6 d-flex flex-column" style="min-height: 0;">
                <h3 class="h5">Implementación provisional:</h3>
                <div class="card flex-grow-1 border-0 shadow-sm overflow-hidden d-flex flex-column" style="background-color: #1a803f;">
                    
                    <div class="card-body text-white text-center d-flex flex-column justify-content-between py-3">
                        
                        <div>
                            <h2 class="h4 mb-0">UNO</h2>
                            <p class="small opacity-75">Turno de: Tú</p>
                            <div class="row g-0 mt-2">
                                <div class="col-4">
                                    <div class="fw-bold" style="font-size: 0.75rem;">Jugador 2</div>
                                    <div class="d-flex justify-content-center mt-1">
                                        <div class="bg-danger border border-white rounded-1" style="width: 1.5rem; height: 2.2rem;"></div>
                                        <div class="bg-danger border border-white rounded-1 ms-n3" style="width: 1.5rem; height: 2.2rem;"></div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="fw-bold" style="font-size: 0.75rem;">Jugador 3</div>
                                    <div class="d-flex justify-content-center mt-1">
                                        <div class="bg-danger border border-white rounded-1" style="width: 1.5rem; height: 2.2rem;"></div>
                                        <div class="bg-danger border border-white rounded-1 ms-n3" style="width: 1.5rem; height: 2.2rem;"></div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="fw-bold" style="font-size: 0.75rem;">Jugador 4</div>
                                    <div class="d-flex justify-content-center mt-1">
                                        <div class="bg-danger border border-white rounded-1" style="width: 1.5rem; height: 2.2rem;"></div>
                                        <div class="bg-danger border border-white rounded-1 ms-n3" style="width: 1.5rem; height: 2.2rem;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center align-items-center flex-grow-1 my-2">
                            <div class="bg-danger border border-white rounded-2 shadow" style="width: 4rem; height: 6rem;"></div>
                            <div class="mx-3 fs-2 opacity-50">›</div>
                            <div class="bg-danger border border-white rounded-2 shadow d-flex align-items-center justify-content-center fw-bold fs-4" style="width: 4rem; height: 6rem;">
                                7
                            </div>
                        </div>

                        <div>
                            <div class="d-flex justify-content-center mb-2">
                                <div class="bg-primary border border-white rounded-1 shadow-sm" style="width: 2.5rem; height: 4rem;"></div>
                                <div class="bg-warning border border-white rounded-1 shadow-sm ms-n3" style="width: 2.5rem; height: 4rem;"></div>
                                <div class="bg-success border border-white rounded-1 shadow-sm ms-n3" style="width: 2.5rem; height: 4rem;"></div>
                            </div>
                            <div class="badge rounded-pill text-bg-warning px-3 shadow-sm mb-1">Tu Turno</div>
                            <p class="small mb-0 opacity-75">Tú (3 cartas)</p>
                        </div>

                    </div>
                </div>
            </div>
</div>
        </div>
    </div>
</main>
    <th:block th:replace="~{fragments/footer.html :: footer}" />

</body>

</html>
