<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: UNO</title>
</head>

<body class="d-flex flex-column h-100 bg-light">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                        <div>
                            <h1 class="h4 mb-1">Partida UNO (Paso 1)</h1>
                            <p class="text-muted mb-0">
                                <span th:text="${'Lobby: ' + lobbyCode}">Lobby: ABC123</span>
                                <span id="gameModeBadge" class="badge text-bg-primary ms-2" th:text="${lobbyMode}">UNO</span>
                                <span id="gameVisibilityBadge" class="badge text-bg-dark" th:text="${lobbyPrivate ? 'Privada' : 'Publica'}">Publica</span>
                            </p>
                        </div>
                        <a th:href="@{/lobby(code=${lobbyCode})}" class="btn btn-light btn-sm border">Volver al lobby</a>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="border rounded p-2">
                                <strong>Turno:</strong> <span id="turnLabel">-</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="border rounded p-2">
                                <strong>Sentido:</strong> <span id="directionLabel">-</span>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-secondary py-2 mb-3" id="gameMessage" role="status">
                        Pulsa una carta valida de tu mano o el mazo para robar.
                    </div>

                    <div class="border rounded p-2" style="background:#f8f9fa; overflow-x:auto;">
                        <svg id="unoBoard" width="1100" height="720" role="img" aria-label="Tablero UNO"></svg>
                    </div>

                    <div class="card border mt-3">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Chat del lobby</h5>
                            <div id="lobbyChatMessages" class="border rounded p-3 bg-white" style="height: 220px; overflow-y: auto;">
                                <p class="text-muted mb-0" id="lobbyChatEmpty">Todavía no hay mensajes. ¡Habla con tu lobby!</p>
                            </div>
                            <form id="lobbyChatForm" class="mt-3">
                                <div class="input-group">
                                    <input id="lobbyChatInput" type="text" class="form-control" maxlength="400" placeholder="Escribe un mensaje..." autocomplete="off" required>
                                    <button class="btn btn-primary" type="submit">Enviar</button>
                                </div>
                                <div id="lobbyChatError" class="text-danger small mt-2 d-none" role="alert"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
    <script th:inline="javascript">
        window.initialUnoState = {
            lobbyCode: /*[[${lobbyCode}]]*/ "",
            players: /*[[${playerNames}]]*/ [],
            currentUsername: /*[[${currentUsername}]]*/ "",
            lobbyMode: /*[[${lobbyMode}]]*/ "UNO",
            lobbyPrivate: /*[[${lobbyPrivate}]]*/ false
        };
    </script>
    <script th:src="@{/js/game.js}" src="/js/game.js"></script>

</body>

</html>
