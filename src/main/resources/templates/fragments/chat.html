<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>chat</title>
</head>

<body>
    <div th:fragment="lobbyChat" class="card border mt-3">
        <div class="card-body">
            <h5 class="card-title mb-3">Chat del lobby</h5>
            <div id="lobbyChatMessages" class="border rounded p-3 bg-white" style="height: 220px; overflow-y: auto;">
                <p class="text-muted mb-0" id="lobbyChatEmpty">Todavía no hay mensajes. ¡Habla con tu lobby!</p>
            </div>
            <form id="lobbyChatForm" class="mt-3">
                <div class="input-group">
                    <input id="lobbyChatInput" type="text" class="form-control" maxlength="400"
                        placeholder="Escribe un mensaje..." autocomplete="off" required>
                    <button class="btn btn-primary" type="submit">Enviar</button>
                </div>
                <div id="lobbyChatError" class="text-danger small mt-2 d-none" role="alert"></div>
            </form>
        </div>
    </div>
</body>



</html>
