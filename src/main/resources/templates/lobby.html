<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Lobby</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-grow-1 py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                        <h1 class="fw-bold mb-0 text-dark">Sala de espera</h1>
                        <div class="d-flex flex-wrap gap-2">
                            <span id="playerCountBadge" class="badge text-bg-secondary" th:text="${'Jugadores: ' + #lists.size(players) + '/' + maxPlayers}">Jugadores: 1/4</span>
                            <span id="modeBadge" class="badge text-bg-primary" th:text="${lobby.modalidad}">UNO</span>
                            <span id="visibilityBadge" class="badge text-bg-dark" th:text="${lobby.privado ? 'Privada' : 'Publica'}">Publica</span>
                            <span id="statusBadge" class="badge text-bg-info" th:text="${lobby.estado}">LOBBY</span>
                        </div>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-2">Código de la partida</h5>
                            <p id="lobbyCodeLabel" class="mb-0 fs-5 fw-semibold text-primary" th:text="${lobby.code}">ABC123</p>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-lg-5">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Jugadores en lobby</h5>
                                    <ul id="playersList" class="list-group">
                                        <li class="list-group-item d-flex justify-content-between align-items-center"
                                            th:each="slot, slotStat : ${#numbers.sequence(1, maxPlayers)}">
                                            <span th:if="${slotStat.index < #lists.size(players)}"
                                                th:text="${players[slotStat.index].username != null ? players[slotStat.index].username : 'Jugador sin nombre'}">Jugador</span>
                                            <span th:unless="${slotStat.index < #lists.size(players)}" class="text-muted">Esperando jugador...</span>
                                            <span class="badge text-bg-light border"
                                                th:if="${slotStat.index < #lists.size(players) and players[slotStat.index].username != null and players[slotStat.index].username == lobby.host.username}">Owner</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-7">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Configuración de partida</h5>

                                    <form th:action="@{/lobby/settings}" method="post" class="row g-3">
                                        <input type="hidden" name="code" th:value="${lobby.code}">

                                        <div class="col-12">
                                            <label for="modalidad" class="form-label fw-semibold">Modalidad</label>
                                            <select id="modalidad" name="modalidad" class="form-select" th:disabled="${!isOwner}" data-owner-disabled>
                                                <option value="UNO" th:selected="${lobby.modalidad == 'UNO'}">UNO</option>
                                                <option value="DOS" th:selected="${lobby.modalidad == 'DOS'}">DOS</option>
                                                <option value="UNO_NO_MERCY" th:selected="${lobby.modalidad == 'UNO_NO_MERCY'}">UNO No Mercy</option>
                                            </select>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label fw-semibold d-block mb-2">Visibilidad</label>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" name="privado" id="publico" value="false"
                                                    th:checked="${!lobby.privado}" th:disabled="${!isOwner}" data-owner-disabled>
                                                <label class="form-check-label" for="publico">Pública</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" name="privado" id="privado" value="true"
                                                    th:checked="${lobby.privado}" th:disabled="${!isOwner}" data-owner-disabled>
                                                <label class="form-check-label" for="privado">Privada</label>
                                            </div>
                                        </div>

                                        <div class="col-12" data-owner-only th:classappend="${!isOwner} ? ' d-none' : ''">
                                            <button type="submit" class="btn btn-primary">Guardar configuración</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mt-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Chat del lobby</h5>
                            <div id="lobbyChatMessages" class="border rounded p-3 bg-white" style="height: 240px; overflow-y: auto;">
                                <p class="text-muted mb-0" id="lobbyChatEmpty">Todavía no hay mensajes. ¡Rompe el hielo!</p>
                            </div>
                            <form id="lobbyChatForm" class="mt-3">
                                <div class="input-group">
                                    <input id="lobbyChatInput" type="text" class="form-control" maxlength="400" placeholder="Escribe un mensaje..." autocomplete="off" required>
                                    <button class="btn btn-primary" type="submit">Enviar</button>
                                </div>
                                <div id="lobbyChatError" class="text-danger small mt-2 d-none" role="alert"></div>
                            </form>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4 justify-content-end">
                        <form data-owner-only th:classappend="${!isOwner} ? ' d-none' : ''" th:action="@{/lobby/start}" method="post" class="m-0">
                            <input type="hidden" name="code" th:value="${lobby.code}">
                            <button type="submit" class="btn btn-success">Comenzar a jugar</button>
                        </form>

                        <form th:action="@{/lobby/leave}" method="post" class="m-0">
                            <input type="hidden" name="code" th:value="${lobby.code}">
                            <button type="submit" class="btn btn-outline-secondary">Salir</button>
                        </form>

                        <form data-owner-only th:classappend="${!isOwner} ? ' d-none' : ''" th:action="@{/lobby/close}" method="post" class="m-0">
                            <input type="hidden" name="code" th:value="${lobby.code}">
                            <button type="submit" class="btn btn-danger">Cerrar lobby</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
    <script th:inline="javascript">
        window.lobbyRealtimeConfig = {
            code: /*[[${lobby.code}]]*/ "",
            currentUsername: /*[[${currentUsername}]]*/ "",
            maxPlayers: /*[[${maxPlayers}]]*/ 4,
            initialState: {
                code: /*[[${lobby.code}]]*/ "",
                estado: /*[[${lobby.estado}]]*/ "LOBBY",
                modalidad: /*[[${lobby.modalidad}]]*/ "UNO",
                privado: /*[[${lobby.privado}]]*/ false,
                host: /*[[${lobby.host.username}]]*/ "",
                players: /*[[${players.![username]}]]*/ []
            }
        };
    </script>
    <script th:src="@{/js/lobby.js}" src="/js/lobby.js"></script>
</body>

</html>
